[package]
name = "lumen-desk"
version = "0.1.0"
description = "Professional live wallpaper and Windows desktop customization app"
authors = ["Lumen Desk"]
edition = "2021"

[lib]
name = "lumen_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = [] }
